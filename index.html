<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Forms is a section of the webpage used to collect user's information -->
     <center>
        <h1>REGISTRATION FORM</h1>
        <form action="">
        <label for="">First Name</label><br>
        <input type="text" placeholder="Abimfoluwa"><br>
        <br>

        <label for="">Last Name</label><br>
        <input type="text" id="Last name" placeholder="Lawal"><br>
        <br>

        <label for="">Email Address</label><br>
        <input type="email" id="Email" placeholder="bisola@gmail.com"><br>
        <br>

        <label for="">Gender</label>
        <br>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label> <br><br>

        <label for="">Phone Number</label><br>
        <input type="text" placeholder="+2348033005803"><br>
        <br>

        <label for="">Password</label><br>
        <input type="password" id="Password" placeholder="**********"><br><br>

        <label for="">D.O.B</label><br>
        <input type="date" id="date of birth"><br><br>



        <p>What's your hobby</p>

        <label for="">Football</label>
        <input type="checkbox" id="football" name="hobbies" value="football"><br>

        <label for="">Reading</label>
        <input type="checkbox" id="reading" name="hobbies" value="reading"><br>

        <label for="">Chess</label>
        <input type="checkbox" id="Chess" name="hobbies" value="Chess"><br><br>

        <label for="">File Upload</label><br>
        <input type="file" id="file" name=""><br><br>

        <label for="">Upload Image</label><br>
        <input type="image" id="Image" max="">
        </form>
        <br>
        <button>Submit</button>

     </center>
</body>
</html>
